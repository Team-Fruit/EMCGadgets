plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = "${mc_version}-${mod_version}"
group = 'net.teamfruit'
archivesBaseName = 'emcgadgets'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            arg "-mixin.config=emcgadgets.mixins.json"

            mods {
                emcgadgets {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            arg "-mixin.config=emcgadgets.mixins.json"

            mods {
                emcgadgets {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "emcgadgets.refmap.json"
    config "emcgadgets.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url 'https://maven.blamejared.com' }
    maven { url 'https://cursemaven.com' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'

    // Mixin
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // 依存Mod (CurseMavenから取得)
    // ProjectE: https://www.curseforge.com/minecraft/mc-mods/projecte (ID: 226410)
    // BuildingGadgets: https://www.curseforge.com/minecraft/mc-mods/building-gadgets (ID: 298187)
    // JEI: https://www.curseforge.com/minecraft/mc-mods/jei (ID: 238222)
    compileOnly fg.deobf('curse.maven:projecte-226410:3736621')
    compileOnly fg.deobf('curse.maven:building-gadgets-298187:4552317')
    runtimeOnly fg.deobf('curse.maven:projecte-226410:3736621')
    runtimeOnly fg.deobf('curse.maven:building-gadgets-298187:4552317')
    runtimeOnly fg.deobf('curse.maven:jei-238222:4371666')
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "emcgadgets",
            "Specification-Vendor"    : "TeamFruit",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "TeamFruit",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs"            : "emcgadgets.mixins.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
